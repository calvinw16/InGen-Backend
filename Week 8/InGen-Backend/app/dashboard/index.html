<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>InGen · Operator dashboard</title><link rel="stylesheet" href="/dashboard-assets/dashboard.css">
<script defer src="/dashboard-assets/dashboard.js"></script></head>
<body><main>
<header><div><div class="eyebrow">INGEN / PERCEPTION</div><h1>Operator dashboard</h1></div><p id="status" role="status">Connecting…</p></header>
<form id="filters"><label>Robot <select id="robot"><option value="">All robots</option></select></label>
<label>From (local) <input id="start" type="datetime-local"></label>
<label>To (local) <input id="end" type="datetime-local"></label>
<button>Apply range</button><button type="reset">Clear</button></form>
<section><h2>Active alerts</h2><label>Operator <input id="actor" maxlength="120" placeholder="Your name"></label>
<label>Operator token <input id="token" type="password" autocomplete="off"></label><ul id="events"></ul></section>
<section><h2>Robot state</h2><ul id="states"></ul><button id="more" type="button" hidden>Load more robots</button></section>
<section><h2>Recent detections</h2><div class="table"><table><thead><tr><th>Captured</th><th>Robot</th><th>Class</th><th>Confidence</th></tr></thead>
<tbody id="detections"></tbody></table></div></section>
</main></body></html>
